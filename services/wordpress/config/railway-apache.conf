# Railway-specific Apache settings.
ServerName localhost
ServerTokens Prod
ServerSignature Off

# Lightweight health endpoint for Railway healthchecks. It lives outside the WordPress
# document root, so it answers before the site is installed and never touches the database.
Alias /healthz /usr/local/share/railway/health/health.php
<Directory /usr/local/share/railway/health>
    Require all granted
    Options -Indexes
</Directory>

# Long-lived static assets.
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType image/avif "access plus 30 days"
    ExpiresByType image/webp "access plus 30 days"
    ExpiresByType image/jpeg "access plus 30 days"
    ExpiresByType image/png "access plus 30 days"
    ExpiresByType image/svg+xml "access plus 30 days"
    ExpiresByType font/woff2 "access plus 1 year"
    ExpiresByType text/css "access plus 7 days"
    ExpiresByType application/javascript "access plus 7 days"
    ExpiresByType text/javascript "access plus 7 days"
</IfModule>

# Never serve backup/dump files that might end up in the web root or uploads.
<FilesMatch "\.(sql|sql\.gz|bak|log|ini|sh)$">
    Require all denied
</FilesMatch>
