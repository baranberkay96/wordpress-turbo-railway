; PHP tuning for WordPress on Railway. Loaded last (zz-) so it overrides the image defaults.
; Values come from environment variables; defaults are set in the Dockerfile (ENV).

memory_limit = ${PHP_MEMORY_LIMIT}
upload_max_filesize = ${PHP_UPLOAD_MAX_FILESIZE}
post_max_size = ${PHP_POST_MAX_SIZE}
max_execution_time = ${PHP_MAX_EXECUTION_TIME}
max_input_time = ${PHP_MAX_EXECUTION_TIME}
max_input_vars = ${PHP_MAX_INPUT_VARS}
expose_php = Off

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; OPcache: larger than the image defaults (128 MB / 4000 files), sized for plugin-heavy sites.
opcache.enable = 1
opcache.memory_consumption = ${PHP_OPCACHE_MEMORY}
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.save_comments = 1
